name: app_motorista
description: "App Controlo Horas e Vencimento Motorista"
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Pacotes do Projeto
  local_auth: ^2.3.0
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0
  sqflite: ^2.4.0
