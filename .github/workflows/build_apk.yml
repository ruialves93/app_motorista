name: Build Flutter Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: FIX Groovy QName Compilation Bug
        run: |
          # Encontra o ficheiro flutter.groovy no cache do Flutter e remove a linha incompatível com o novo Groovy
          GROOVY_FILE=$(find /opt/hostedtoolcache/flutter -name "flutter.groovy" | head -n 1)
          if [ -f "$GROOVY_FILE" ]; then
            echo "A corrigir o ficheiro em: $GROOVY_FILE"
            sed -i '/import groovy.xml.QName/d' "$GROOVY_FILE"
          else
            echo "Ficheiro flutter.groovy não encontrado, a ignorar..."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk